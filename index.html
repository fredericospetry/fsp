<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>FSP.ADS();</title>
    <link rel="icon"
        href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='80' font-size='80'>💻</text></svg>">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Iceland&display=swap');

        * {
            box-sizing: border-box;
        }

        body {
            background-color: transparent;
            font-family: 'Iceland', cursive;
            padding: 15px;
            margin: 10px;
            min-height: auto;
            padding-bottom: 25px;
            border: 1px solid #B0B0B033;
            border-bottom: 1px solid #B0B0B055;
            position: relative;
            overflow: visible;
            display: flow-root;
            max-width: 100vw;
            margin-bottom: 20px;
        }

        body::before {
            content: '// FSP.DEV - TERMINAL';
            position: absolute;
            top: -12px;
            left: 20px;
            background: #000;
            color: #00FFFF;
            padding: 0 10px;
            font-size: 0.8em;
        }

        body::after {
            content: 'SINCE 1988 ©';
            position: absolute;
            bottom: 0px;
            right: 20px;
            background: #000;
            color: #00FFFF;
            padding: 0 10px;
            font-size: 0.8em;
            z-index: 10;
            transform: translateY(50%);
        }

        html {
            background-color: #000000;
        }

        .cursor {
            color: #00FFFF;
            font-size: 0.8em;
            vertical-align: middle;
            animation: piscar 1s infinite;
        }

        @keyframes piscar {
            0% {
                opacity: 1;
            }

            50% {
                opacity: 0;
            }

            100% {
                opacity: 1;
            }
        }

        h1 {
            color: #00FFFF;
            text-shadow: 0 0 10px #00FFFF,
                0 0 20px #00FFFF,
                0 0 40px #00FFFF;
            font-size: 1.4em;
            font-weight: 300;
            letter-spacing: 2px;
        }

        h1,
        p {
            position: relative;
            z-index: 1;
        }

        .recuo1 {
            margin-left: 2px;
        }

        .recuo2 {
            margin-left: 5px;
        }

        .recuo3 {
            margin-left: 10px;
        }

        .recuo4 {
            margin-left: 15px;
        }

        .recuo5 {
            margin-left: 32px;
        }

        p {
            color: #B0B0B0;
            text-shadow: 0 0 5px #B0B0B0;
            font-size: 0.9em;
            min-height: 1.5em;
            font-weight: 300;
            letter-spacing: 1px;
        }

        p a {
            color: #B0B0B0;
            text-decoration: underline;
            transition: color 0.3s, text-shadow 0.3s;
        }

        p a:hover {
            color: #00FFFF;
            text-shadow: 0 0 10px #00FFFF;
        }

        #plexus {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            opacity: 0.6;
            overflow: hidden;
        }

        /* ============= Menu lateral */
        #conteudoPrincipal {
            margin-left: 0;
        }

        #menuContainer {
            position: relative;
            left: 0;
            top: 0;
            z-index: 2;
            width: auto;
            margin-bottom: 15px;
        }

        #menuBtn {
            color: #B0B0B0;
            cursor: pointer;
            font-size: 1em;
            text-shadow: 0 0 5px #B0B0B0;
            transition: color 0.3s, text-shadow 0.3s;
        }

        #menuBtn:hover {
            color: #00FFFF;
            text-shadow: 0 0 10px #00FFFF;
        }

        #btnInicio {
            display: none;
            color: #B0B0B0;
            cursor: pointer;
            padding: 6px 0 12px 0;
            transition: color 0.3s, text-shadow 0.3s;
        }

        #btnInicio:hover {
            color: #00FFFF;
            text-shadow: 0 0 10px #00FFFF;
        }

        #menuLateral {
            display: block;
            max-height: 0;
            overflow: hidden;
            opacity: 0;
            transition: max-height 0.4s ease, opacity 0.3s ease, margin-top 0.3s ease;
            margin-top: 0;
            padding: 0;
        }

        #menuLateral.aberto {
            max-height: 350px;
            opacity: 1;
            margin-top: 15px;
        }

        #fecharMenu {
            color: #B0B0B0;
            cursor: pointer;
            font-size: 0.9em;
            display: inline;
            margin-bottom: 0;
        }

        #fecharMenu:hover {
            color: #00FFFF;
            text-shadow: 0 0 10px #00FFFF;
        }

        #menuHeader {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        #menuLateral a {
            display: block;
            color: #B0B0B0;
            text-decoration: none;
            font-size: 1em;
            padding: 6px 0;
            transition: color 0.3s, text-shadow 0.3s, padding-left 0.3s;
        }

        #menuLateral a:hover {
            color: #00FFFF;
            text-shadow: 0 0 10px #00FFFF;
            padding-left: 10px;
        }

        #menuLateral a.ativo {
            color: #00FFFF;
            text-shadow: 0 0 5px #00FFFF;
        }

        /* ============= Seções SPA */
        .secao-conteudo {
            display: none;
        }

        .secao-conteudo.ativa {
            display: block;
        }

        /* Tablet: a partir de 768px */
        @media (min-width: 768px) {
            body {
                margin: 40px;
                padding: 35px;
                overflow: hidden;
                max-width: none;
            }

            .recuo1 {
                margin-left: 5px;
            }

            .recuo2 {
                margin-left: 20px;
            }

            .recuo3 {
                margin-left: 40px;
            }

            .recuo4 {
                margin-left: 60px;
            }

            #conteudoPrincipal {
                margin-left: 150px;
            }

            #menuContainer {
                position: absolute;
                left: 15px;
                top: 100px;
                width: 130px;
                margin-bottom: 0;
            }

            h1 {
                font-size: 2.2em;
            }

            p {
                font-size: 1.1em;
            }
        }

        /* Desktop: a partir de 1024px */
        @media (min-width: 1024px) {
            body {
                margin: 90px;
                padding: 50px;
                min-height: 100vh;
                overflow: hidden;
            }

            #conteudoPrincipal {
                margin-left: 180px;
            }

            #menuContainer {
                position: absolute;
                left: 20px;
                top: 130px;
                width: 150px;
            }

            #menuLateral.aberto {
                max-height: 400px;
            }

            h1 {
                font-size: 2.5em;
            }

            p {
                font-size: 1.2em;
            }
        }
    </style>
</head>

<body>
    <div id="menuContainer">
        <div id="menuHeader">
            <span id="menuBtn">[menu]</span>
            <span id="fecharMenu">[x]</span>
        </div>
        <nav id="menuLateral">
            <span id="btnInicio">&lt;Início /&gt;</span>
            <a href="#sobre" data-secao="sobre">&lt;Sobre /&gt;</a>
            <a href="#portfolio" data-secao="portfolio">&lt;Portfólio /&gt;</a>
            <a href="#servicos" data-secao="servicos">&lt;Serviços /&gt;</a>
            <a href="#contato" data-secao="contato">&lt;Contato /&gt;</a>
        </nav>
    </div>

    <div id="conteudoPrincipal">
        <div id="secao-inicio" class="secao-conteudo ativa">
            <h1 id="titulo-inicio"></h1>
            <p id="p1-inicio" class="recuo1"></p>
            <p id="p2-inicio" class="recuo2"></p>
            <p id="p3-inicio" class="recuo3"></p>
            <p id="p4-inicio" class="recuo4"></p>
        </div>

        <div id="secao-sobre" class="secao-conteudo">
            <h1 id="titulo-sobre"></h1>
            <p id="p1-sobre" class="recuo1"></p>
            <p id="p2-sobre" class="recuo2"></p>
            <p id="p3-sobre" class="recuo3"></p>
            <p id="p4-sobre" class="recuo4"></p>
        </div>

        <div id="secao-portfolio" class="secao-conteudo">
            <h1 id="titulo-portfolio"></h1>
            <p id="p1-portfolio" class="recuo1"></p>
            <p id="p2-portfolio" class="recuo2"></p>
            <p id="p3-portfolio" class="recuo3"></p>
            <p id="p4-portfolio" class="recuo4"></p>
        </div>

        <div id="secao-servicos" class="secao-conteudo">
            <h1 id="titulo-servicos"></h1>
            <p id="p1-servicos" class="recuo1"></p>
            <p id="p2-servicos" class="recuo2"></p>
            <p id="p3-servicos" class="recuo3"></p>
            <p id="p4-servicos" class="recuo4"></p>
        </div>

        <div id="secao-contato" class="secao-conteudo">
            <h1 id="titulo-contato"></h1>
            <p id="p1-contato" class="recuo1"></p>
            <p id="p2-contato" class="recuo2"></p>
            <p id="p3-contato" class="recuo3"></p>
            <p id="p4-contato" class="recuo4"></p>
        </div>
    </div>

    <canvas id="plexus"></canvas>

    <script>
        const conteudoSecoes = {
            inicio: {
                titulo: "/* FSP.ADS(); */",
                linhas: [
                    "Transformando ideias em código.",
                    "const fspADS = { stack: 'fullStack', status: 'disponível' };",
                    "npm install react node express mysql mongodb docker",
                    "await contato('@PetryFrederico') // me chama!"
                ]
            },
            sobre: {
                titulo: "// Sobre.py",
                linhas: [
                    "Desenvolvedor Full Stack;",
                    "Form. Sup. em ADS, pós-graduado em Gestão de TI;",
                    "Qualidade, inovação e entrega são minhas prioridades;",
                    "Portais, sistemas, APIs, e-commerce, blogs."
                ]
            },
            portfolio: {
                titulo: "// Portfólio.md",
                linhas: [
                    '<a href="https://pdfreed.netlify.app" target="_blank">PDFree</a> - Manipulacao de PDFs',
                    '<a href="https://cactosrs.netlify.app" target="_blank">CactosRS</a> - Publicacao',
                    '<a href="https://guia-de-cultivo-de-cactos.netlify.app" target="_blank">Guia de Cultivo de Cactos</a> - Publicacao',
                    '<a href="https://guiaflorapromata.netlify.app" target="_blank">Guia de Flora Pro-Mata</a> - Publicacao'
                ]
            },
            servicos: {
                titulo: "// Serviços.ts",
                linhas: [
                    "Desenvolvimento Web Front-end e Back-end.",
                    "Criação de APIs RESTful e banco de dados.",
                    "Otimização de performance e SEO.",
                    "Manutenção e atualização de sistemas."
                ]
            },
            contato: {
                titulo: "// Contato.js",
                linhas: [
                    '<a href="https://wa.me/5551998605153" target="_blank">WhatsApp</a>',
                    '<a href="https://www.instagram.com/petryfrederico/" target="_blank">Instagram</a> - @petryfrederico',
                    '<a href="mailto:fredericospetry@gmail.com">Email</a> - fredericospetry@gmail.com',
                    'Vamos conversar!'
                ]
            }
        };

        function digitarTexto(elemento, texto, velocidade, callback, manterCursor) {
            let i = 0;
            function digitar() {
                if (i < texto.length) {
                    elemento.innerHTML = texto.substring(0, i + 1) + '<span class="cursor">█</span>';
                    i++;
                    setTimeout(digitar, velocidade);
                } else {
                    elemento.innerHTML = texto + '<span class="cursor">█</span>';
                    if (!manterCursor) {
                        setTimeout(() => {
                            let cursorSpan = elemento.querySelector('.cursor');
                            if (cursorSpan) cursorSpan.style.display = 'none';
                            if (callback) callback();
                        }, 500);
                    }
                }
            }
            digitar();
        }

        function digitarSecao(secao, callback) {
            const dados = conteudoSecoes[secao];
            const tituloEl = document.getElementById('titulo-' + secao);
            const paragrafos = [];
            for (let i = 1; i <= dados.linhas.length; i++) {
                paragrafos.push(document.getElementById('p' + i + '-' + secao));
            }

            tituloEl.innerHTML = '';
            paragrafos.forEach(p => p.innerHTML = '');

            const velLinha = secao === 'portfolio' ? 1 : 20;

            digitarTexto(tituloEl, dados.titulo, 40, () => {
                let idx = 0;
                function proximaLinha() {
                    if (idx < dados.linhas.length) {
                        const ultima = idx === dados.linhas.length - 1;
                        digitarTexto(paragrafos[idx], dados.linhas[idx], velLinha, () => {
                            idx++;
                            proximaLinha();
                        }, ultima);
                    } else if (callback) {
                        callback();
                    }
                }
                proximaLinha();
            }, false);
        }

        function navegarPara(secao) {
            document.querySelectorAll('.secao-conteudo').forEach(s => s.classList.remove('ativa'));
            document.getElementById('secao-' + secao).classList.add('ativa');
            digitarSecao(secao);

            const btnInicio = document.getElementById('btnInicio');
            if (secao === 'inicio') {
                btnInicio.style.display = 'none';
            } else {
                btnInicio.style.display = 'block';
            }
        }

        function iniciar() {
            const menuBtn = document.getElementById('menuBtn');
            const fecharMenu = document.getElementById('fecharMenu');
            const menuLateral = document.getElementById('menuLateral');
            const btnInicio = document.getElementById('btnInicio');

            fecharMenu.style.display = 'none';

            menuBtn.addEventListener('click', () => {
                menuLateral.classList.add('aberto');
                menuBtn.style.display = 'none';
                fecharMenu.style.display = 'inline';
            });

            fecharMenu.addEventListener('click', () => {
                menuLateral.classList.remove('aberto');
                menuBtn.style.display = 'inline';
                fecharMenu.style.display = 'none';
            });

            btnInicio.addEventListener('click', () => {
                navegarPara('inicio');
                document.querySelectorAll('#menuLateral a').forEach(l => l.classList.remove('ativo'));
            });

            document.querySelectorAll('#menuLateral a').forEach(link => {
                link.addEventListener('click', (e) => {
                    e.preventDefault();
                    const secao = link.getAttribute('data-secao');
                    navegarPara(secao);
                    document.querySelectorAll('#menuLateral a').forEach(l => l.classList.remove('ativo'));
                    link.classList.add('ativo');
                });
            });

            digitarSecao('inicio');
        }

        // ============= PLEXUS =============
        const canvas = document.getElementById('plexus');
        const ctx = canvas.getContext('2d');

        function redimensionar() {
            const body = document.body;
            canvas.width = body.clientWidth;
            canvas.height = body.clientHeight;
        }

        redimensionar();

        let pontos = [];
        for (let i = 0; i < 60; i++) {
            pontos.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                vx: (Math.random() - 0.5) * 0.5,
                vy: (Math.random() - 0.5) * 0.5
            });
        }

        function animar() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            pontos.forEach(p => {
                p.x += p.vx;
                p.y += p.vy;
                if (p.x < 0 || p.x > canvas.width) p.vx *= -1;
                if (p.y < 0 || p.y > canvas.height) p.vy *= -1;
            });

            pontos.forEach(p => {
                ctx.beginPath();
                ctx.arc(p.x, p.y, 2, 0, Math.PI * 2);
                ctx.fillStyle = '#00FFFF';
                ctx.fill();
            });

            pontos.forEach((a, i) => {
                pontos.slice(i + 1).forEach(b => {
                    let dist = Math.hypot(a.x - b.x, a.y - b.y);
                    if (dist < 200) {
                        ctx.beginPath();
                        ctx.moveTo(a.x, a.y);
                        ctx.lineTo(b.x, b.y);
                        ctx.strokeStyle = `rgba(0, 255, 255, ${0.5 * (1 - dist / 200)})`;
                        ctx.lineWidth = 0.5;
                        ctx.stroke();
                    }
                });
            });

            requestAnimationFrame(animar);
        }

        animar();

        window.addEventListener('resize', () => {
            redimensionar();
            pontos.forEach(p => {
                p.x = Math.random() * canvas.width;
                p.y = Math.random() * canvas.height;
            });
        });

        document.addEventListener('DOMContentLoaded', iniciar);
        document.addEventListener('contextmenu', e => e.preventDefault());
    </script>
</body>

</html>
